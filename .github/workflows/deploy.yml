name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
      - run: npm ci
        env:
          NEXT_PUBLIC_SITE_URL: https://app.boris-reminder.workers.dev
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 367ca81763872c78fbc5a8d69ac8eb1d
          NEXT_PUBLIC_SITE_URL: https://app.boris-reminder.workers.dev
