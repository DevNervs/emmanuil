# Автодеплой сайту Emmanuil на Cloudflare Pages
name: Deploy to Cloudflare Pages

on:
  # Cloudflare Pages Git integration is the primary CI/CD path. Keep this
  # Direct Upload workflow only as an explicit emergency fallback.
  workflow_dispatch:

concurrency:
  group: emmanuil-pages-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build, test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and run tests
        run: npm test

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.EMMANUIL_SITE_URL }}
        run: npm run deploy
